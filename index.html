<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Fitting Lab"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#030d03"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-180.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <title>Golf Fitting Lab</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030d03;
      color: #ddeedd;
      font-family: Georgia, serif;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #root { min-height: 100vh; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    input, select, textarea { font-size: 16px !important; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #2a5a2a; font-family: Georgia, serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Loading Fitting Lab…</div></div>
  <script src="app.js"></script>
  <script>
    try {
      const App = window.__App;
      if (!App) throw new Error('App component not found in app.js');
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;color:#f87171;font-family:monospace;font-size:12px">' +
        'Error: ' + e.message + '</div>';
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
      });
    }
  </script>
</body>
</html>
